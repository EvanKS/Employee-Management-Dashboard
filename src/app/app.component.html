<!-- Top Navbar / Toolbar -->
<app-navbar (menuToggle)="toggleSidenav()"></app-navbar>

<!-- Sidenav Container -->
<mat-sidenav-container class="sidenav-container">

  <!-- Left Sidebar Navigation -->
  <mat-sidenav
    #sidenav
    mode="side"
    [opened]="sidenavOpened"
    class="sidenav">

    <mat-nav-list>
      <a mat-list-item routerLink="/home" routerLinkActive="active-link">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>
      <a mat-list-item routerLink="/employees" routerLinkActive="active-link">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Employees</span>
      </a>
      <a mat-list-item routerLink="/add-employee" routerLinkActive="active-link">
        <mat-icon matListItemIcon>person_add</mat-icon>
        <span matListItemTitle>Add Employee</span>
      </a>
    </mat-nav-list>

    <!-- Footer in sidebar -->
    <div class="sidenav-footer">
      <p>&copy; 2024 Employee Dashboard</p>
    </div>

  </mat-sidenav>

  <!-- Main Content Area -->
  <mat-sidenav-content class="main-content">
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
